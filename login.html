<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ChefAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="logo"><i class="bi bi-fire"></i><span>ChefAI</span></div>
            <h2>Bon retour</h2>
            <p class="subtitle">Connectez-vous pour accéder à vos recettes et votre cuisine.</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="vous@exemple.com" required>
                </div>
                <div class="mb-4">
                    <label for="loginPassword" class="form-label">Mot de passe</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Votre mot de passe" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-accent w-100">
                    <span class="btn-text">Se connecter</span>
                    <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
                </button>
            </form>

            <div class="auth-divider">ou</div>

            <button id="googleLoginBtn" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 019.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 000 24c0 3.77.87 7.34 2.56 10.78l7.97-6.19z"/><path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Continuer avec Google
            </button>

            <div class="auth-footer">
                Vous n'avez pas de compte ? <a href="register.html">Créer un compte</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebaseConfig.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Redirect if already logged in
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = "dashboard.html";
        });

        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const loginSpinner = document.getElementById("loginSpinner");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            loginBtn.disabled = true;
            loginSpinner.classList.remove("d-none");
            try {
                await Auth.login(email, password);
            } catch (err) {
                // Error already handled in Auth.login
            } finally {
                loginBtn.disabled = false;
                loginSpinner.classList.add("d-none");
            }
        });

        document.getElementById("googleLoginBtn").addEventListener("click", async () => {
            try { await Auth.googleSignIn(); } catch (err) {}
        });
    </script>
</body>
</html>
